name: "Bug report"
description: "Something crashed or behaved wrong"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command run, expected vs actual. Include the traceback if any.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target type
      placeholder: ".apk or decoded AndroidManifest.xml"
  - type: input
    id: env
    attributes:
      label: Python / OS / intentscope version
