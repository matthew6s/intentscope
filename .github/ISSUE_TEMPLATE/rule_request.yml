name: "Rule request"
description: "Suggest a new detection rule"
labels: ["rule-request"]
body:
  - type: textarea
    id: pattern
    attributes:
      label: Pattern to detect
      description: The manifest attribute or bytecode call pattern, and why it's a risk.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example (vulnerable) snippet
      render: xml
  - type: input
    id: refs
    attributes:
      label: References
      description: CVE, writeup, or docs describing the issue class.
