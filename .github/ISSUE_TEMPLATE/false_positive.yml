name: "False positive"
description: "A finding that isn't actually a vulnerability"
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "e.g. IS002"
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Relevant manifest / component
      description: The <activity>/<intent-filter> (or class) that was flagged. Redact anything sensitive.
      render: xml
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it's not exploitable
      description: What makes this safe in practice?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: intentscope version
      placeholder: "intentscope --version or the release tag"
