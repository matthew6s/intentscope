# Drop this into .github/workflows/ to gate PRs on deep-link / exported-component risk
# and surface findings in GitHub's Security tab.
name: intentscope
on: [pull_request]
permissions:
  contents: read
  security-events: write   # for the SARIF upload
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: intentscope
        uses: matthew6s/intentscope@main
        with:
          target: app/src/main/AndroidManifest.xml
          fail-on: HIGH
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.intentscope.outputs.sarif-file }}
